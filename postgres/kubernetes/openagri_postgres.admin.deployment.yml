apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: ilvo-openagri-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      containers:
        - name: pgadmin
          image: dpage/pgadmin4
          ports:
            - containerPort: 80
          envFrom:
            - secretRef:
                name: secrets-admin
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin-service
  namespace: ilvo-openagri-postgres
spec:
  selector:
    app: pgadmin
  ports:
    - name: pgadmin-port
      protocol: TCP 
      port: 80
      targetPort: 80
  type: ClusterIP  # Or LoadBalancer / NodePort
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pgadmin
  namespace: ilvo-openagri-postgres
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: "pgadmin.ilvonuc.com"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pgadmin-service
            port:
              number: 80
