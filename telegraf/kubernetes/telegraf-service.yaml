apiVersion: v1
kind: Service
metadata:
  name: telegraf-tcp-listener
  namespace: ilvo-openagri-tick
spec:
  selector:
    app.kubernetes.io/name: telegraf-ds  # Match the labels Telegraf uses
  ports:
    - name: tcp8094
      protocol: TCP
      port: 8094
      targetPort: 8094
      nodePort: 30001
  type: NodePort # ClusterIP / LoadBalancer / NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: telegraf-udp-listener
  namespace: ilvo-openagri-tick
spec:
  selector:
    app.kubernetes.io/name: telegraf-ds  # Match the labels Telegraf uses
  ports:
    - name: udp8094
      protocol: UDP
      port: 8094
      targetPort: 8094
      nodePort: 30000
  type: NodePort # ClusterIP / LoadBalancer / NodePort

