# Deploys a namespace and MinIO workload.
apiVersion: v1
kind: Namespace
metadata:
  name: ilvo-openagri-minio # Change this value if you want a different namespace name
  labels:
    name: ilvo-openagri-minio # Change this value to match metadata.name
---
apiVersion: v1
kind: Service
metadata:
  name: minio-api-and-console
  namespace: ilvo-openagri-minio
spec:
  selector:
    app: minio  # Match the labels Telegraf uses
  ports:
    - name: minio-api
      protocol: TCP 
      port: 9000
      targetPort: 9000
      nodePort: 30003
    - name: minio-console
      protocol: TCP 
      port: 9090
      targetPort: 9090
      nodePort: 30004
  type: NodePort  # Or LoadBalancer / NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: minio-headless
  namespace: ilvo-openagri-minio
spec:
  clusterIP: None
  selector:
    app: minio
  ports:
    - name: minio-api
      port: 9000
      targetPort: 9000
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: minio-volume
  labels:
    app: minio
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /srv/openagri/minio/data
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-volume-claim
  namespace: ilvo-openagri-minio
  labels:
    app: minio
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: ilvo-openagri-minio
spec:
  serviceName: minio-headless
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      nodeSelector:
        kubernetes.io/hostname: replace-with-node-name
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - minio server /data --console-address :9090
          envFrom:
            - secretRef:
                name: minio-credentials
          env:
            - name: MINIO_LOG_LEVEL
              value: "debug"
          ports:
            - name: minio-api
              containerPort: 9000
            - name: minio-console
              containerPort: 9090
          volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-volume-claim
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-setup
  namespace: ilvo-openagri-minio
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: minio/mc
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c", "/config/init.sh"]
          envFrom:
            - secretRef:
                name: minio-credentials
          volumeMounts:
            - name: minio-config-volume
              mountPath: /config
      volumes:
        - name: minio-config-volume
          configMap:
            name: minio-setup-config
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-ingress
  namespace: ilvo-openagri-minio
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  ingressClassName: nginx
  rules:
  - host: "minio.example.invalid"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: minio-api-and-console
            port:
              number: 9090

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-api-ingress
  namespace: ilvo-openagri-minio
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  ingressClassName: nginx
  rules:
  - host: "api.minio.example.invalid"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: minio-api-and-console
            port:
              number: 9000

